  } else if(STATE.masterTab==='pos'){
    body = `<div class="table-wrap"><table><thead><tr><th>PO Number</th><th>Vendor</th><th>Value</th><th>Balance</th><th>Active</th><th>Valid to</th></tr></thead><tbody>
      ${STATE.pos.map((p,idx)=>`<tr>
        <td><input data-action="masterField" data-list="pos" data-idx="${idx}" data-key="number" value="${esc(p.number)}" style="width:100px" class="num"></td>
        <td><select data-action="masterField" data-list="pos" data-idx="${idx}" data-key="vendor" style="width:200px">${STATE.vendors.map(v=>`<option ${v.name===p.vendor?'selected':''}>${esc(v.name)}</option>`).join('')}</select></td>
        <td><input type="number" data-action="masterField" data-list="pos" data-idx="${idx}" data-key="value" value="${p.value}" style="width:100px" class="num"></td>
        <td><input type="number" data-action="masterField" data-list="pos" data-idx="${idx}" data-key="balance" value="${p.balance}" style="width:100px" class="num"></td>
        <td><select data-action="masterField" data-list="pos" data-idx="${idx}" data-key="active"><option value="true" ${p.active?'selected':''}>Yes</option><option value="false" ${!p.active?'selected':''}>No</option></select></td>
        <td><input type="date" data-action="masterField" data-list="pos" data-idx="${idx}" data-key="validTo" value="${p.validTo}"></td>
      </tr>`).join('')}
    </tbody></table></div>
    <div class="btnrow"><button class="btn" data-action="addPO">+ Add PO</button></div>`;
  } else if(STATE.masterTab==='agreements'){
    body = `<div class="table-wrap"><table><thead><tr><th>Number</th><th>Vendor</th><th>Start</th><th>End</th><th>Value</th><th>Consumed</th></tr></thead><tbody>
      ${STATE.agreements.map((a,idx)=>`<tr>

        <td><input type="date" data-action="masterField" data-list="agreements" data-idx="${idx}" data-key="startDate" value="${a.startDate}"></td>
        <td><input type="date" data-action="masterField" data-list="agreements" data-idx="${idx}" data-key="endDate" value="${a.endDate}"></td>
        <td><input type="number" data-action="masterField" data-list="agreements" data-idx="${idx}" data-key="value" value="${a.value}" style="width:100px" class="num"></td>
        <td><input type="number" data-action="masterField" data-list="agreements" data-idx="${idx}" data-key="consumed" value="${a.consumed}" style="width:100px" class="num"></td>

  return `<div class="tabs">${tabs}</div><div class="card">${body}</div>`;
}

/* --------------------------------- AUDIT TRAIL -------------------------------*/
function renderAudit(){
  if(!STATE.auditLog.length) return `<div class="card empty"><div class="empty-title">No activity yet</div><div>Every submit, review, approval, rejection and override will be logged here.</div></div>`;
  return `<div class="card"><div class="table-wrap"><table>
    <thead><tr><th>Timestamp</th><th>Invoice</th><th>User</th><th>Role</th><th>Action</th><th>From → To</th><th>Comments</th></tr></thead>
    <tbody>${STATE.auditLog.map(a=>`<tr><td class="small-muted num">${new Date(a.timestamp).toLocaleString('en-IN')}</td><td class="num">${esc(a.invoiceNumber)}</td><td>${esc(a.user)}</td><td>${esc(a.role)}</td><td>${esc(a.action)}</td><td>${esc(a.fromStatus||'')} → ${esc(a.toStatus||'')}</td><td class="small-muted">${esc(a.comments||'')}</td></tr>`).join('')}</tbody>
  </table></div></div>`;
}

/* ================================ EVENT HANDLING ============================ */
function attachHandlers(){
  const root = document.getElementById('root');

  root.querySelectorAll('[data-action="bindInput"]').forEach(el=>{
    el.addEventListener('input', ()=>{ setPath(STATE.draft, el.dataset.field, el.value); STATE.draft.lastUpdatedDate = nowISO(); });
  });
  root.querySelectorAll('[data-action="bindChange"]').forEach(el=>{
    el.addEventListener('change', ()=>{ setPath(STATE.draft, el.dataset.field, el.value); STATE.draft.lastUpdatedDate = nowISO(); render(); });
  });

  root.querySelectorAll('[data-action="excField"]').forEach(el=>{
    el.addEventListener(el.tagName==='SELECT'?'change':'input', ()=>{
      const ex = STATE.draft.exceptions.find(e=>e.id===el.dataset.exid);
      if(ex){ ex[el.dataset.key] = el.value; if(el.dataset.key==='status' && el.value==='Resolved'){ ex.resolutionDate = ex.resolutionDate||todayISO(); } }
      commitInvoice(STATE.draft); save();
    });
  });

  root.querySelectorAll('[data-action="masterField"]').forEach(el=>{
    el.addEventListener(el.tagName==='SELECT'?'change':'input', ()=>{
      const list = STATE[el.dataset.list]; const item = list[el.dataset.idx]; let v = el.value;
      if(v==='true') v=true; else if(v==='false') v=false; else if(el.type==='number') v = num(v);
      item[el.dataset.key] = v; save();
    });
  });
  root.querySelectorAll('[data-action="settingField"]').forEach(el=>{
    el.addEventListener('input', ()=>{ STATE.settings[el.dataset.key] = num(el.value); save(); });
  });

  root.querySelectorAll('[data-action="filterDash"]').forEach(el=>{
    el.addEventListener(el.tagName==='SELECT'?'change':'input', ()=>{ STATE.dashFilters[el.dataset.key] = el.value; save(); });
  });
  root.querySelectorAll('[data-action="filterReg"]').forEach(el=>{
    el.addEventListener(el.tagName==='SELECT'?'change':'input', ()=>{ STATE.registerFilters[el.dataset.key] = el.value; render(); });
  });

  root.querySelectorAll('[data-action="uploadDoc"]').forEach(el=> el.addEventListener('change', onUploadDoc));

  const roleSel = root.querySelector('[data-action="setRole"]');
  if(roleSel) roleSel.addEventListener('change', ()=>{ STATE.currentRole = roleSel.value; save(); });
  const userInp = root.querySelector('[data-action="setUser"]');
  if(userInp) userInp.addEventListener('focus', ()=>{ userInp.select(); });
  if(userInp) userInp.addEventListener('input', ()=>{ STATE.currentUser = userInp.value; });
  if(userInp) userInp.addEventListener('change', ()=>{ persist(); });
}

function onClick(e){
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.dataset.action;

  if(action==='nav'){ STATE.view = el.dataset.view; STATE.activeInvoiceId = null; if(el.dataset.view==='new'){ STATE.draft = null; STATE.wizardStep='details'; } save(); }
  else if(action==='wstep'){ STATE.wizardStep = el.dataset.step; render(); }
  else if(action==='openInvoice'){ STATE.activeInvoiceId = el.dataset.id; STATE.view='new'; STATE.wizardStep='review'; render(); }
  else if(action==='openInvoiceExceptions'){ STATE.activeInvoiceId = el.dataset.id; STATE.view='new'; STATE.wizardStep='exceptions'; render(); }
  else if(action==='runValidation'){ refreshValidation(STATE.draft); commitInvoice(STATE.draft); save(); }
  else if(action==='genExceptions'){ generateExceptionsFromValidation(STATE.draft); commitInvoice(STATE.draft); save(); }
  else if(action==='wf'){ handleWorkflowAction(el.dataset.wf); STATE.wizardStep = (el.dataset.wf==='save'||el.dataset.wf==='submit') ? STATE.wizardStep : 'review'; render(); }
  else if(action==='removeDoc'){ STATE.draft.documents = STATE.draft.documents.filter(d=>d.id!==el.dataset.docid); commitInvoice(STATE.draft); save(); }
  else if(action==='exportExcel'){ exportExcel(); }
  else if(action==='applyOcr'){ applyOcrToForm(); }
  else if(action==='masterTab'){ STATE.masterTab = el.dataset.tab; render(); }
  else if(action==='addVendor'){ STATE.vendors.push({code:'V-'+Math.floor(1000+Math.random()*9000), name:'New Vendor', gstin:'', pan:'', bank:'', address:'', contact:'', active:true, paymentTerms:'Net 30', currency:'INR', msme:false, tan:''}); render(); }
  else if(action==='addPO'){ STATE.pos.push({number:'PO-'+Math.floor(60000+Math.random()*9000), vendor: STATE.vendors[0]?STATE.vendors[0].name:'', date: todayISO(), value:0, balance:0, active:true, validTo: addDays(todayISO(),180), currency:'INR', lineItems:[]}); render(); }
  else if(action==='addAgreement'){ STATE.agreements.push({number:'AG-'+new Date().getFullYear()+'-'+Math.floor(100+Math.random()*900), vendor: STATE.vendors[0]?STATE.vendors[0].name:'', startDate: todayISO(), endDate: addDays(todayISO(),365), value:0, consumed:0, billingFrequency:'Monthly', pricing:''}); render(); }
  else if(action==='addOtherDoc'){ addOtherDocument(); }
  else if(action==='resetDemo'){
    const ok = window.confirm('This will permanently erase all invoices, exceptions, audit history and any master-data edits, and restore the original demo state. Continue?');
    if(ok){ STATE = seedState(); STATE.masterTab = 'rules'; save(); toast('Demo data reset.'); }
  }
}

function onUploadDoc(e){
  const file = e.target.files[0];
  if(!file) return;
  const doctype = e.target.dataset.doctype;
  const doc = { id: uid('DOC'), type: doctype, fileName: file.name, uploadDate: todayISO(), uploadedBy: STATE.currentUser, refNumber:'', status:'Uploaded' };
  STATE.draft.documents = STATE.draft.documents.filter(d=>d.type!==doctype || doctype==='Other');
  STATE.draft.documents.push(doc);
  commitInvoice(STATE.draft);

  if(doctype==='Invoice' && (file.type.startsWith('image/') || file.type==='application/pdf')){
    toast('Extracting invoice fields with AI…');
    runOcrExtraction(file).then(extracted=>{
      STATE.draft.ocr = extracted;
      commitInvoice(STATE.draft);
      save();
      toast('AI extraction complete — review the comparison below.');
    }).catch(err=>{
      console.error(err);
      toast('AI extraction failed — you can still enter the fields manually.');
      save();
    });
  } else {
    save();
  }
}

function addOtherDocument(){
  const type = document.getElementById('addDocType').value;
  const ref = document.getElementById('addDocRef').value;
  const fileEl = document.getElementById('addDocFile');
  const file = fileEl.files[0];
  STATE.draft.documents.push({ id: uid('DOC'), type, fileName: file?file.name:'(reference only — no file attached)', uploadDate: todayISO(), uploadedBy: STATE.currentUser, refNumber: ref, status:'Uploaded' });
  commitInvoice(STATE.draft);
  save();
}

function applyOcrToForm(){
  const inv = STATE.draft;
  const map = { vendorName:'vendorName', invoiceNumber:'invoiceNumber', invoiceDate:'invoiceDate', currency:'currency', taxableValue:'taxableValue', cgst:'cgst', sgst:'sgst', igst:'igst', grossValue:'grossValue', poNumber:'poNumber', paymentTerms:'paymentTerms', dueDate:'dueDate' };
  let changed = false;
  Object.entries(map).forEach(([k,target])=>{
    const v = inv.ocr[k];
    if(v!==null && v!==undefined && v!=='' && String(v)!==String(inv[target]||'')){ inv[target] = v; changed = true; }
  });
  if(changed) inv.manualOverrideOfOcr = false; // values came from AI, not a manual override
  commitInvoice(inv);
  save();
  toast('AI-extracted values applied to the form.');
}

/* ================================ INIT ====================================== */
document.getElementById('root').addEventListener('click', onClick); // bound once — #root itself is never replaced, only its innerHTML
loadState();
</script>
</body>
</html>
